# DINO+iBOT + DINO-Gram (anchor: DINO epoch 250), ViT-B/16.
# Continues the DINO+iBOT run from its epoch-260 checkpoint; see scripts/train_gram.sh.
jea:                        # DINO class-token self-distillation branch
  loss_weight: 1.0
  head_out_dim: 256         # bottleneck dimension of the projection head
  head_nlayers: 3
  head_hidden_dim: 2048
  dino_prototypes: 131072
  koleo_loss_weight: 0.1
ibot:                       # masked patch self-distillation (cross-entropy, Sinkhorn-Knopp targets)
  use_loss: true
  loss_weight: 1.0          # fixed throughout training
  separate_head: true       # separate DINO / iBOT projection heads, as in DINOv2
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
gram:                       # Gram anchoring (Appendix "Experimental Settings for Gram Anchoring")
  use_loss: true
  # Epoch-250 EMA teacher used as the initial Gram anchor. Set by scripts/train_gram.sh:
  #   Gram      -> DINO+iBOT epoch-250 teacher of the same backbone
  #   DINO-Gram -> DINO epoch-250 teacher of the same backbone
  ckpt: ${oc.env:GRAM_TEACHER_CHECKPOINT}
  ep_load_ema_teacher: -1   # anchor comes from gram.ckpt, not from the running EMA
  rep_update: true          # refresh the anchor from the current EMA teacher ...
  ep_first_update: 270      # ... at epochs 270, 280 and 290
  update_frequency: 10
  max_updates: 3
  normalized: true          # l2-normalized patch features
  img_level: true           # Gram matrix per global crop
  remove_neg: false         # negative similarities are not clipped
  remove_only_teacher_neg: false
  loss_weight_schedule:     # 0 until epoch 260, cosine ramp to 2 over one epoch, then 2
    start: 0
    peak: 0
    end: 2
    warmup_epochs: 260
    cosine_epochs: 1
train:
  batch_size_per_gpu: 256       # 4 GPUs -> global batch 1024
  dataset_path: ImageNet:split=TRAIN:root=datasets/ImageNet:extra=datasets/ImageNet
  output_dir: out/          # runs are written to <output_dir>/<wandb.env_name>
  seed: 0
  num_workers: 12
  cache_dataset: true
  saveckp_freq: 5
  saveckp_epochs:           # full training checkpoint at epoch 260; Gram runs resume from it
  - 260
student:
  arch: vit_base
  depth: 12
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  drop_path_uniform: true
  pretrained_weights: ''
  ffn_layer: swiglufused
  block_chunks: 4
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 4
  interpolate_antialias: true
  interpolate_offset: 0.1
teacher:
  momentum_teacher: 0.994
  final_momentum_teacher: 1
  dino_teacher_temp: 0.07
  dino_warmup_teacher_temp: 0.04
  dino_warmup_teacher_temp_epochs: 30
optim:
  epochs: 300
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 0.004            # peak LR for a global batch of 1024
  lr: 0.0                   # set from base_lr with scaling_rule
  warmup_epochs: 10
  min_lr: 1.0e-06
  clip_grad: 3
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 0.9
  dino_freeze_last_layer_epochs: 1
crops:
  aug_type: asym
  global_crops_number: 2
  local_crops_number: 8
  global_crops_size: 224
  local_crops_size: 96
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_scale:
  - 0.05
  - 0.32
evaluation:
  eval_period_epochs: 10    # export the EMA teacher every 10 epochs
  knn: false
wandb:
  project: locality-tradeoff
  env_name: dino_ibot_vit_b16_dino_gram
  mode: disabled
